<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Sitesi Örnekleri</title>
  <meta name="description" content="Kurumsal web sitesi tasarım ve geliştirme örnekleri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Inter, system-ui, sans-serif; color: #1c1f1e; background: #f7f6f3; -webkit-font-smoothing: antialiased; }
    main { max-width: 1040px; margin: 0 auto; padding: 72px 20px; }
    h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; }
    .lead { margin-top: 12px; color: #5b605e; max-width: 560px; line-height: 1.6; }
    .grid { margin-top: 40px; display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    a.card { display: block; background: #fff; border: 1px solid #e4e2dc; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; transition: box-shadow .2s, transform .2s; }
    a.card:hover { box-shadow: 0 14px 34px -16px rgba(0,0,0,.25); transform: translateY(-2px); }
    .thumb { aspect-ratio: 16/10; background: #dcd8cf center/cover no-repeat; }
    .body { padding: 20px 22px 24px; }
    .tag { font-size: 12px; font-weight: 600; color: #2f6f71; }
    h2 { margin-top: 6px; font-size: 20px; }
    .body p { margin-top: 8px; font-size: 14px; color: #5b605e; line-height: 1.55; }
    .go { margin-top: 16px; font-size: 14px; font-weight: 600; color: #1c1f1e !important; }
    footer { margin-top: 56px; font-size: 12px; color: #8a8e8b; }
  </style>
</head>
<body>
  <main>
    <h1>Web sitesi örnekleri</h1>
    <p class="lead">Mobil uyumlu, hızlı açılan, form ve WhatsApp entegrasyonlu web siteleri. Kartlara tıklayarak canlı demoları inceleyebilirsiniz.</p>
    <div class="grid" id="projeler"></div>
    <footer>Örnek projelerdeki işletme ve iletişim bilgileri temsilidir. Fotoğraflar: Unsplash.</footer>
  </main>

  <script>
    /* ============================================================
       YENİ PROJE EKLEMEK İÇİN:
       1) Projeyi repoda yeni bir klasöre koyun (ör. "restoran/").
       2) Aşağıdaki listeye bir satır ekleyin. Başka bir şey gerekmez.
       ============================================================ */
    const PROJELER = [
      {
        klasor: 'harman-kahve',
        ad: 'Harman Kahve Dükkanı',
        sektor: 'Kafe · Kahve kavurmacısı',
        aciklama: 'Espresso ve filtre kahve menüsü, çekirdek çeşitleri ve WhatsApp üzerinden paket kahve siparişi.',
        gorsel: 'harman-kahve/img/espresso.webp'
      },
      {
        klasor: 'nefes-reformer-site',
        ad: 'Nefes Pilates',
        sektor: 'Spor · Pilates stüdyosu',
        aciklama: 'Reformer dersleri, ders saatleri ve WhatsApp üzerinden ders rezervasyonu.',
        gorsel: 'nefes-reformer-site/img/hero.webp'
      },
      {
        klasor: 'dentalux',
        ad: 'DentaLux',
        sektor: 'Sağlık · Diş kliniği',
        aciklama: 'Tedavi tanıtımı, tedavi süreci, KVKK onaylı randevu formu, harita ve SSS.',
        gorsel: 'https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=900&q=75'
      },
      {
        klasor: 'mavibag',
        ad: 'Mavibağ Butik Otel',
        sektor: 'Turizm · Butik otel',
        aciklama: 'Oda ve fiyat tanıtımı, müsaitlik sorgulama, tutar hesaplayan ve WhatsApp\'a ileten rezervasyon formu.',
        gorsel: 'https://images.unsplash.com/photo-1737400604966-95536db9c01b?auto=format&fit=crop&w=900&q=75'
      }
    ];

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    document.getElementById('projeler').innerHTML = PROJELER.map(p => `
      <a class="card" href="${esc(p.klasor)}/">
        <div class="thumb" style="background-image:url('${esc(p.gorsel)}')"></div>
        <div class="body">
          <span class="tag">${esc(p.sektor)}</span>
          <h2>${esc(p.ad)}</h2>
          <p>${esc(p.aciklama)}</p>
          <p class="go">Demoyu aç →</p>
        </div>
      </a>`).join('');
  </script>
</body>
</html>
